name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  # Tests de medios (vips, exiftool, ffmpeg) dentro de la imagen `dev`, igual que `bun run test:media`.
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          target: dev
          tags: lfg-dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      - name: bun test con MEDIA_TESTS=1 en el contenedor
        run: |
          docker run --rm -v "$PWD:/app" -v lfg-node-modules:/app/node_modules -e MEDIA_TESTS=1 lfg-dev \
            sh -c "bun install --frozen-lockfile --ignore-scripts && bun test"

  # Playwright (viewport de Android) contra la imagen `prod` real. Solo fixtures sintéticos.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay tests e2e?
        id: has
        run: |
          if [ -d apps/web/e2e ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No existe apps/web/e2e todavía: se saltea el e2e."; fi
      - if: steps.has.outputs.run
        uses: docker/setup-buildx-action@v3
      - if: steps.has.outputs.run
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          target: prod
          tags: lfg-app:e2e
          build-args: APP_VERSION=e2e
          load: true
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,scope=app-amd64,mode=max
      - if: steps.has.outputs.run
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      - if: steps.has.outputs.run
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - if: steps.has.outputs.run
        run: bun install --frozen-lockfile
      - if: steps.has.outputs.run
        run: cd apps/web && bunx --bun playwright install --with-deps chromium
      - if: steps.has.outputs.run
        run: bun run e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - if: failure() && steps.has.outputs.run
        run: docker compose -f docker-compose.e2e.yml logs --tail 200
      - if: failure() && steps.has.outputs.run
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 3
