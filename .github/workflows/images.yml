# Imágenes de producción (linux/amd64) a GHCR: app/worker y caddy, con tags latest, v<VERSION> y sha-<7>.
# Son PÚBLICAS: no llevan secretos; la configuración entra por variables de entorno al correr.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            file: docker/app.Dockerfile
            target: prod
          - name: caddy
            file: docker/caddy.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - name: Nombre y tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${GITHUB_SHA::7}"
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "VERSION tiene que ser tipo 0.6"; exit 1; }
          image="ghcr.io/${owner}/local-family-gallery-${{ matrix.name }}"
          {
            echo "version=${version}"
            echo "tags=${image}:latest,${image}:v${version},${image}:sha-${short}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=local-family-gallery-${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}-amd64
          cache-to: type=gha,scope=${{ matrix.name }}-amd64,mode=max
